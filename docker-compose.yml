version: '3.8'

# This file joins multiple services to run them together
# We define our API gateway and core backend service here
services:
  # The API Gateway service configuration
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8081:8081"
    depends_on:
      - document-core-service
    networks:
      - doc-network

  # The Document Core backend service configuration
  document-core-service:
    build: ./backend/document-core-service
    ports:
      - "8080:8080"
    networks:
      - doc-network

# Defines a common network for services to communicate
networks:
  doc-network:
    driver: bridge
