spring.application.name=document-centralizer-backend

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/document_centralizer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root


# ==============================
# Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.documentcentralizer.controller

# ==============================
# File Storage & Upload Limits
# ==============================
file.upload-dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# JWT Configuration
# ==========================================
# Secret key used to sign the JWT token (Must be a long secure string)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration time for JWT token in milliseconds (e.g., 86400000 ms = 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Mail Configuration (SMTP Placeholders)
# ==========================================
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
