spring.application.name=document-centralizer-backend

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/document_centralizer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123

# Load .env file automatically
spring.config.import=optional:file:.env[.properties]

# ==============================
# Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.documentcentralizer.controller

# ==============================
# File Storage & Upload Limits
# ==============================
spring.servlet.multipart.max-file-size=10MB
#spring.servlet.multipart.max-request-size=10MB

# ==========================================
# AWS S3 Configuration
# ==========================================
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# JWT Configuration
# ==========================================
# Secret key used to sign the JWT token (Must be a long secure string)
jwt.secret=${JWT_SECRET}
# Expiration time for JWT token in milliseconds (e.g., 86400000 ms = 24 hours)
jwt.expiration=${JWT_EXPIRATION}

# ==========================================
# Razorpay Configuration
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_SECRET}

# ==========================================
# Mail Configuration (SMTP Placeholders)
# ==========================================
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# External APIs & URLs
# ==========================================
groq.api.key=${GROQ_API_KEY}
backend.url=${BACKEND_URL}
