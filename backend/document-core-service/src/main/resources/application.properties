spring.application.name=document-centralizer-backend

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/document_centralizer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123

# ==============================
# Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.documentcentralizer.controller

# ==============================
# File Storage & Upload Limits
# ==============================
file.upload-dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB