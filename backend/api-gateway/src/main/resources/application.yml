server:
  # The API Gateway runs on port 8081
  # This acts as the single entry point for all clients
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuration for CORS (Cross-Origin Resource Sharing)
      # Allows the frontend to communicate with the gateway safely
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      
      # Defining the routes to join with document-core-service
      routes:
        # Route mapping all document-core-service endpoints
        # Forwards these requests to the core service running on port 8080
        - id: document-core-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**, /api/mock/authbridge/**, /api/documents/**, /api/admin/**, /api/payment/**, /api/super-admin/**, /api/users/**
            
        # Optional: Route for Python OCR Service (if it uses port 5000)
        - id: python-ocr-service
          uri: http://localhost:5000
          predicates:
            - Path=/api/ocr/**

        # Optional: Route for AI Chatbot Service (if it uses port 5001)
        - id: ai-chatbot-service
          uri: http://localhost:5001
          predicates:
            - Path=/api/chat/**

        # Optional: Route for Notification Service (if it uses port 8082)
        - id: notification-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/notifications/**

# Expose actuator endpoints for health checks
# Useful for monitoring if the gateway is running properly
management:
  endpoints:
    web:
      exposure:
        include: health,info
